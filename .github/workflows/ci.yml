name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 외부 공인 서버(Cloudflare·AdGuard) 상호운용을 하루 한 번 회귀 검사.
    - cron: "17 6 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-verifiers:
    name: repository regression verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify control plane, dashboard, copy, structure, and schema
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            tools/verify_dashboard.py \
            tools/verify_rust_structure.py
          do
            python3 "$script"
          done

  # 스타일/정적분석 게이트(플랫폼 무관 — ubuntu 1회). fmt·clippy 모두 실패 시 CI 차단.
  lint:
    name: fmt · clippy (gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt (deny diffs)
        run: cargo fmt --all --check

      # 게이트: clippy 경고 0(주관적 린트는 [workspace.lints.clippy]에서 allow, 실버그 그룹은 deny).
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 빌드·테스트 게이트(OS 매트릭스). 컴파일 경고 0 + 전 워크스페이스 테스트 통과.
  test:
    name: build · test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2

      # 리눅스는 127.0.0.0/8 전체를 루프백에 붙여 두지만 macOS 는 127.0.0.1 하나만
      # 설정한다. 위임 계층을 흉내 내려고 서버마다 다른 루프백 주소를 묶는 시험이 있어,
      # 주소를 하나씩 쫓는 대신 리눅스와 같은 상태를 만들어 준다.
      - name: Add loopback aliases (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          for octet in $(seq 2 254); do
            sudo ifconfig lo0 alias "127.0.0.$octet" up
          done
          ifconfig lo0 | grep -c 'inet 127\.'

      - name: Test (deny compiler warnings)
        run: cargo test --workspace
        env:
          RUSTFLAGS: "-D warnings"

      - name: Build release
        run: cargo build --workspace --release
        env:
          RUSTFLAGS: "-D warnings"

  # 경량 edge 빌드(보고서 #11): 대시보드 제외 — ubuntu만.
  minimal-build:
    name: minimal build (no dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build minimal
        run: cargo build -p onetdns --no-default-features --profile release-min

  # 저사양 32비트 배포에서 포인터 폭과 Linux 소켓 ABI를 함께 회귀 검사한다.
  pointer-width-32:
    name: i686 build · test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit Linux linker and libc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test 32-bit workspace
        run: cargo test --workspace --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-D warnings"

  # 릴리스가 빌드하는 musl 대상은 다른 작업이 컴파일하지 않는 cfg 분기를 탄다. 32비트
  # musl 과 c_char 가 부호 없는 ARM 이 그렇다. 태그를 붙인 뒤에야 깨진 것을 알게 되지
  # 않도록 여기서 미리 컴파일한다.
  release-targets:
    name: release target check (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-musl, i686-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
      - name: Check musl release targets
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl i686-unknown-linux-musl \
                        aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            cargo check -p onetdns --release --locked --target "$target"
          done
        env:
          RUSTFLAGS: "-D warnings"

  # 공급망 게이트: RustSec 취약점·철회 크레이트, 라이선스, 출처를 deny.toml 정책으로 검사.
  supply-chain:
    name: cargo-audit · cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Cargo Audit (RustSec)
        run: cargo audit
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  parser-panic-sweep:
    name: std-only parser panic sweep (1M)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Sweep malformed parser inputs
        run: cargo test -p onetdns --test parser_panic_safety -- --nocapture
        env:
          ONETDNS_SWEEP_ITERS: "1000000"
      # 컴파일된 필터 캐시는 디스크에서 오는 입력이고, 봉투 SHA-256 때문에 훼손 뒤
      # 다시 봉인해야 본문 파서가 노출된다. 그래서 크레이트 안의 스위프로 따로 돈다.
      - name: Sweep resealed compiled-filter-cache mutations
        run: cargo test -p onetdns-filter --release cache_decoder_never_panics -- --nocapture
        env:
          ONETDNS_SWEEP_ITERS: "1000000"

  # 표준 클라(dig/kdig) + dnsperf interop. 외부 의존 없이 로컬 권한 존을 서빙해 질의한다.
  interop:
    name: protocol interop (dig · kdig · dnsperf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Install DNS clients
        run: sudo apt-get update && sudo apt-get install -y dnsutils knot-dnsutils dnsperf

      - name: Build server
        run: cargo build -p onetdns --release
        env:
          RUSTFLAGS: "-D warnings"

      - name: Write authoritative zone + config
        run: |
          cat > interop.zone <<'EOF'
          $ORIGIN interop.test.
          $TTL 3600
          @ 3600 IN SOA ns1.interop.test. admin.interop.test. 1 7200 3600 1209600 3600
          @ 3600 IN NS ns1.interop.test.
          ns1 3600 IN A 127.0.0.1
          www 3600 IN A 192.0.2.10
          mail 3600 IN AAAA 2001:db8::25
          EOF
          cat > interop.toml <<'EOF'
          listen = ["127.0.0.1:15353"]
          tls_self_signed_host = "localhost"
          listen_dot = ["127.0.0.1:15853"]
          listen_doh = ["127.0.0.1:15443"]
          listen_doq = ["127.0.0.1:15854"]
          [[zones]]
          origin = "interop.test"
          file = "interop.zone"
          EOF
          cat > privdrop.toml <<'EOF'
          listen = ["127.0.0.1:535"]
          workers = 1
          run_as_user = "65534"
          run_as_group = "65534"
          [[zones]]
          origin = "interop.test"
          file = "interop.zone"
          EOF

      - name: Start server
        run: |
          ./target/release/OnetDNS run --config interop.toml &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if dig @127.0.0.1 -p 15353 www.interop.test A +short +time=1 >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

      - name: Supervisor — abort child and recover
        run: |
          set -eu
          PARENT=$(cat server.pid)
          OLD_CHILD=$(pgrep -P "$PARENT" | head -n 1)
          test -n "$OLD_CHILD"
          kill -ABRT "$OLD_CHILD"
          NEW_CHILD=""
          for i in $(seq 1 100); do
            NEW_CHILD=$(pgrep -P "$PARENT" | grep -vx "$OLD_CHILD" | head -n 1 || true)
            if [ -n "$NEW_CHILD" ] && \
               dig @127.0.0.1 -p 15353 www.interop.test A +short +time=1 2>/dev/null | grep -qx "192.0.2.10"; then
              break
            fi
            sleep 0.05
          done
          test -n "$NEW_CHILD"
          test "$NEW_CHILD" != "$OLD_CHILD"
          kill -0 "$PARENT"
          OUT=$(dig @127.0.0.1 -p 15353 www.interop.test A +short +time=1)
          test "$OUT" = "192.0.2.10"

      - name: Supervisor — privilege drop and privileged-port recovery
        run: |
          set -eu
          # 권한을 낮춘 감독자는 낮춘 사용자로 자기 실행 파일을 다시 실행하고 존 파일도
          # 다시 읽는다. 러너의 /home/runner 는 0750 이라 nobody 가 지나갈 수 없으므로,
          # 실제 배포와 같이 누구나 지나갈 수 있는 자리에 두고 확인한다.
          WORK=/tmp/onetdns-privdrop
          rm -rf "$WORK"
          mkdir -m 755 "$WORK"
          install -m 755 target/release/OnetDNS "$WORK/OnetDNS"
          install -m 644 interop.zone privdrop.toml "$WORK/"
          # 이 단계는 성공해도 실패해도 화면에 아무것도 내지 않아서, 실패했을 때
          # 감독자가 죽었는지 포트를 못 잡았는지조차 구분할 수 없었다. 서버가 남긴
          # privdrop.log 는 실패 원인이 그대로 적히는 유일한 자리라 반드시 출력한다.
          diagnose() {
            echo "::group::권한 강등 진단"
            echo "--- 감독자 PID 파일: $(cat "$WORK/priv-supervisor.pid" 2>/dev/null || echo 없음)"
            ps -eo pid,ppid,user,args | grep -F OnetDNS | grep -v grep || echo "--- OnetDNS 프로세스 없음"
            for pid in ${PARENT:-} ${OLD_CHILD:-} ${NEW_CHILD:-}; do
              echo "--- /proc/$pid/status"
              awk '/^(Uid|Gid|NoNewPrivs|CapEff|CapBnd|CapAmb):/{print}' "/proc/$pid/status" 2>&1 || true
            done
            echo "--- 작업 디렉터리"
            ls -la "$WORK"
            echo "--- 535 포트 수신자"
            sudo -n ss -lunp "sport = :535" 2>&1 || true
            echo "--- privdrop.log"
            cat "$WORK/privdrop.log" 2>&1 || echo 없음
            echo "::endgroup::"
          }
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              diagnose
            fi
            if [ -f "$WORK/priv-supervisor.pid" ]; then
              sudo -n kill -TERM "$(cat "$WORK/priv-supervisor.pid")" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          sudo -n sh -c "cd $WORK; echo \$\$ > priv-supervisor.pid; exec ./OnetDNS run --config privdrop.toml --no-web" >"$WORK/privdrop.log" 2>&1 &
          LAUNCHER=$!
          PARENT=""
          for i in $(seq 1 100); do
            if [ -s "$WORK/priv-supervisor.pid" ]; then
              PARENT=$(cat "$WORK/priv-supervisor.pid")
              PROC_UID=$(awk '/^Uid:/{print $2}' "/proc/$PARENT/status" 2>/dev/null || true)
              if [ "$PROC_UID" = "65534" ] && \
                 dig @127.0.0.1 -p 535 www.interop.test A +short +time=1 2>/dev/null | grep -qx "192.0.2.10"; then
                break
              fi
            fi
            sleep 0.05
          done
          test -n "$PARENT"
          test "$(awk '/^Uid:/{print $2}' "/proc/$PARENT/status")" = "65534"
          dig @127.0.0.1 -p 535 www.interop.test A +short | grep -qx "192.0.2.10"
          OLD_CHILD=$(pgrep -P "$PARENT" | head -n 1 || true)
          test -n "$OLD_CHILD"
          echo "감독자 $PARENT, 자식 $OLD_CHILD 가 65534 로 535 를 서빙합니다"
          python3 - "$PARENT" "$OLD_CHILD" <<'PY'
          import re, sys
          required = sum(1 << bit for bit in (10, 11, 12, 13))
          for pid in sys.argv[1:]:
              fields = {}
              with open(f'/proc/{pid}/status', encoding='ascii') as status:
                  for line in status:
                      if ':' in line:
                          key, value = line.split(':', 1)
                          fields[key] = value.strip()
              assert fields['NoNewPrivs'] == '1'
              assert int(fields['CapEff'], 16) & required == required
              with open(f'/proc/{pid}/limits', encoding='ascii') as limits:
                  match = re.search(r'^Max core file size\s+(\S+)\s+(\S+)', limits.read(), re.MULTILINE)
              assert match and match.groups() == ('0', '0')
          PY
          sudo -n kill -ABRT "$OLD_CHILD"
          NEW_CHILD=""
          for i in $(seq 1 100); do
            NEW_CHILD=$(pgrep -P "$PARENT" | grep -vx "$OLD_CHILD" | head -n 1 || true)
            if [ -n "$NEW_CHILD" ] && \
               dig @127.0.0.1 -p 535 www.interop.test A +short +time=1 2>/dev/null | grep -qx "192.0.2.10"; then
              break
            fi
            sleep 0.05
          done
          test -n "$NEW_CHILD"
          dig @127.0.0.1 -p 535 www.interop.test A +short | grep -qx "192.0.2.10"
          echo "자식을 강제 종료한 뒤 $NEW_CHILD 가 535 를 다시 잡았습니다"
          test "$(awk '/^Uid:/{print $2}' "/proc/$NEW_CHILD/status")" = "65534"
          test "$(awk '/^NoNewPrivs:/{print $2}' "/proc/$NEW_CHILD/status")" = "1"
          CAP_EFF=$(awk '/^CapEff:/{print $2}' "/proc/$NEW_CHILD/status")
          python3 -c 'import sys; required=sum(1 << bit for bit in (10,11,12,13)); assert int(sys.argv[1],16) & required == required' "$CAP_EFF"
          awk '$1 == "Max" && $2 == "core" && $3 == "file" && $4 == "size" { found=1; bad=($5 != 0 || $6 != 0) } END { exit (!found || bad) }' "/proc/$NEW_CHILD/limits"
          sudo -n kill -TERM "$PARENT"
          wait "$LAUNCHER"
          trap - EXIT

      - name: dig — A record (UDP)
        run: |
          set -e
          OUT=$(dig @127.0.0.1 -p 15353 www.interop.test A +short)
          echo "dig A => $OUT"
          test "$OUT" = "192.0.2.10"

      - name: dig — AAAA record (TCP)
        run: |
          set -e
          OUT=$(dig +tcp @127.0.0.1 -p 15353 mail.interop.test AAAA +short)
          echo "dig AAAA (tcp) => $OUT"
          test "$OUT" = "2001:db8::25"

      - name: kdig — SOA + authoritative bit
        run: |
          set -e
          kdig @127.0.0.1 -p 15353 interop.test SOA | tee kdig.out
          grep -q "ns1.interop.test" kdig.out
          grep -qi "flags:.*aa" kdig.out

      # 암호화 전송은 표준 클라이언트로 확인해야 회귀를 잡는다. 이전에는 Do53만
      # 검사해 DoT·DoH가 깨져도 CI가 통과했다.
      - name: kdig — DoT (RFC 7858)
        run: |
          set -e
          kdig @127.0.0.1 -p 15853 +tls www.interop.test A +short | tee dot.out
          grep -qx "192.0.2.10" dot.out

      - name: kdig — DoH (RFC 8484)
        run: |
          set -e
          kdig @127.0.0.1 -p 15443 +https www.interop.test A +short | tee doh.out
          grep -qx "192.0.2.10" doh.out

      - name: kdig — DoQ (RFC 9250)
        run: |
          set -e
          kdig @127.0.0.1 -p 15854 +quic www.interop.test A +short | tee doq.out
          grep -qx "192.0.2.10" doq.out

      - name: dnsperf — throughput smoke
        run: |
          printf "www.interop.test A\nmail.interop.test AAAA\ninterop.test SOA\n" > queries.txt
          dnsperf -s 127.0.0.1 -p 15353 -d queries.txt -l 3 -c 4 | tee dnsperf.out
          grep -qi "Queries completed" dnsperf.out

      - name: Stop server
        if: always()
        run: |
          PARENT=$(cat server.pid)
          kill "$PARENT" || true
          for i in $(seq 1 50); do
            if ! kill -0 "$PARENT" 2>/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          exit 1

  # 자체구현 QUIC/HTTP3/TLS 스택이 실제 공인 서버(Cloudflare·AdGuard)와 상호운용하는지
  # 확인한다. 외부 네트워크에 의존하므로 push/PR에서는 돌리지 않고(외부 장애가 빌드를
  # 깨지 않게) 예약·수동 실행에서만, 실패를 비차단으로 둔다. DoQ 흐름제어 클램프 같은
  # 상호운용 회귀를 잡는 것이 목적이며, kdig가 못 치는 조합(공인 인증서·h3 등)을 덮는다.
  live-interop:
    name: live interop (Cloudflare · AdGuard)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: DoH/DoH3/DoQ against public resolvers
        run: |
          cargo test -p onetdns-forward --release -- --ignored --nocapture \
            doh_live_cloudflare doh3_live_cloudflare doq_live_adguard
