mode = "personal"
backend = "recurse"
listen = ["127.0.0.1:5300"]
workers = 1
do_udp = true
do_tcp = false
dnssec = false
use_caps_for_id = true
cache_enabled = true
cache_size = 20000
querylog = false
root_hints = ["127.0.1.1"]
# 가짜 루트 계층이 루프백에 있으므로 벤치에서만 사설 대상 질의를 허용한다.
recurse_allow_server = ["127.0.0.0/8"]
