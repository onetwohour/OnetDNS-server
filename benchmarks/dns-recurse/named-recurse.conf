// BIND 9 재귀 리졸버 — 가짜 루트 계층. 벤치 전용.
options {
    directory "BENCHDIR";
    pid-file "BENCHDIR/named.pid";
    listen-on port 5300 { 127.0.0.1; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 127.0.0.0/8; };
    allow-query { 127.0.0.0/8; };
    dnssec-validation no;
    qname-minimization off;
    // 가짜 루트가 루프백에 있으므로 사설 대역 질의를 막지 않는다.
    // (BIND는 기본적으로 모든 주소를 질의하므로 별도 허용 불필요.)
    max-cache-size 128m;
};

zone "." {
    type hint;
    file "ROOTHINTS";
};
