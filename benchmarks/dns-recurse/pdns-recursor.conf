# PowerDNS Recursor — 가짜 루트 계층으로 재귀. 벤치 전용.
local-address=127.0.0.1
local-port=5300
threads=1
hint-file=ROOTHINTS
# 루프백/사설 대상 질의 금지를 해제(가짜 루트가 루프백에 있음).
dont-query=
allow-from=127.0.0.0/8
qname-minimization=no
# 가짜 루트는 서명이 없으므로 DNSSEC 검증을 끈다(안 끄면 Bogus로 SERVFAIL).
dnssec=off
# 캐시는 미스 워크로드라 회차마다 재시작으로 비운다.
max-cache-entries=1000000
