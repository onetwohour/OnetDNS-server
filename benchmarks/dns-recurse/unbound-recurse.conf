server:
  interface: 127.0.0.1
  port: 5300
  num-threads: 1
  do-tcp: no
  verbosity: 0
  use-syslog: no
  chroot: ""
  username: ""
  directory: "."
  root-hints: "ROOTHINTS"
  do-not-query-localhost: no
  access-control: 127.0.0.0/8 allow
  module-config: "iterator"
  msg-cache-size: 64m
  rrset-cache-size: 64m
  qname-minimisation: no
  # Unbound 내장 test./localhost 등 특수용도 로컬존을 해제(가짜 test. 계층 사용).
  local-zone: "test." nodefault
  local-zone: "." nodefault
